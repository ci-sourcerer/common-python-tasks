name: ${PACKAGE_NAME}

services:
  api:
    entrypoint: python
    command:
      - -Xfrozen_modules=off
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - -m
      - ${PACKAGE_UNDERSCORE_NAME}
    environment:
      ENVIRONMENT: dev
    build:
      target: debug
    image: ${PACKAGE_NAME}:${IMAGE_TAG}
    develop:
      watch:
        - action: sync+restart
          path: ./src/${PACKAGE_NAME}
          target: /${PACKAGE_NAME}
        - action: rebuild
          path: poetry.lock
    ports:
      - mode: ingress
        target: 5678
        published: ${DEBUG_PORT:-5678}
        protocol: tcp
