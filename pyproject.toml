[project]
name = "common-python-tasks"
description = "Opinionated Poe the Poet tasks for Python package development."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Asbury", email = "ci_sourcerer@yahoo.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "dunamai (>=1.25.0,<2.0.0)",
    "poethepoet-tasks (>=0.3.0,<0.4.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "docker (>=7.1.0,<8.0.0)",
    "tomlkit (>=0.13.3,<0.14.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "git-cliff (>=2.12.0,<3.0.0)",
    "packaging (>=26.2,<27.0)",
    "requests (>=2.34.2,<3.0.0)",
]
dynamic = ["version"]

[project.urls]
Homepage = "http://github.com/ci-sourcerer/common-python-tasks"
Source = "http://github.com/ci-sourcerer/common-python-tasks.git"
Issues = "http://github.com/ci-sourcerer/common-python-tasks/issues"

[tool.poe]
include_script = "common_python_tasks:tasks(exclude_tags=['containers', 'fastapi'])"

[tool.poe.env]
PYTHONPATH = "src"
RELEASE_UPDATE_CHANGELOG = "1"
RELEASE_PRE_SCRIPT = "RELEASE_SCRIPT_PHASE=pre python -m scripts.release_script"
CONTAINER_APT_PACKAGES = "jq"

[tool.poe.tasks]
update-readme-tasks-table = { cmd = "python -m scripts.update_readme_tasks_table" }

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/common_python_tasks"]

[tool.hatch.build.targets.sdist]
include = ["src/common_python_tasks", "scripts", "README.md", "LICENSE"]

[dependency-groups]
debug = ["debugpy (>=1.8.16,<2.0.0)"]

[build-system]
requires = ["hatchling>=1.27.0", "uv-dynamic-versioning>=0.14.0"]
build-backend = "hatchling.build"

[tool.uv-dynamic-versioning]
style = "pep440"
dirty = true

[tool.uv]
package = true

[tool.ruff]
line-length = 88
extend-exclude = [".dist", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["W191"]
